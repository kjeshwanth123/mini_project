{% extends "base.html" %}

{% block title %}Register - MedVerify{% endblock %}

{% block content %}
<div class="card auth-card">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <i class="bi bi-person-plus text-primary" style="font-size: 2.5rem;"></i>
            <h3 class="mt-2">Create Account</h3>
            <p class="text-muted">Join MedVerify to verify medical reports</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">
                <i class="bi bi-person-check"></i> Register
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
